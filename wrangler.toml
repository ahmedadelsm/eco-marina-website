name = "eco-marina"
compatibility_date = "2024-08-01"
pages_build_output_dir = "out"

[[d1_databases]]
binding = "DB"
database_name = "eco-marina-admin"
database_id = "44cf3247-4cb1-48b1-956c-5c057d68ad8a"

[[kv_namespaces]]
binding = "SETTINGS"
id = "0c4554f2657741109b2f20a532826826"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "eco-marina-media"

# Cloudflare Pages applies these exact production bindings. Keep them explicit
# so the Git builder and local Wrangler deployment use the same configuration.
[env.production]
compatibility_date = "2024-08-01"

[[env.production.kv_namespaces]]
binding = "SETTINGS"
id = "0c4554f2657741109b2f20a532826826"

[[env.production.d1_databases]]
binding = "DB"
database_name = "DB"
database_id = "44cf3247-4cb1-48b1-956c-5c057d68ad8a"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "eco-marina-media"
